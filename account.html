<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Your DigiStore account: purchases, downloads, and profile.">
  <title>Your account · DigiStore</title>
  <script>
    try {
      var t = localStorage.getItem('digistore.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="./css/app.css?v=a4e69dd6">
</head>

<body class="page">
  <div id="boot" class="boot">
    <span class="boot__mark">DigiStore</span>
    <div class="progress boot__bar"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container page__body">
    <div class="section__head">
      <div>
        <span class="eyebrow">Your account</span>
        <h1 id="account-name" class="section__title mt-1" style="font-size: var(--t-32)">…</h1>
        <p id="account-sub" class="section__sub">Loading your activity.</p>
      </div>
      <div class="screen__actions">
        <a class="btn btn--sm" href="./store.html">Browse catalog</a>
        <a class="btn btn--sm hidden" id="account-admin" href="./admin.html">Admin console</a>
      </div>
    </div>

    <div class="stat-row" id="account-stats"></div>

    <nav class="tabs mt-8" role="tablist" aria-label="Account sections">
      <button role="tab" aria-selected="true" data-tab="library">Library</button>
      <button role="tab" aria-selected="false" data-tab="orders">Orders</button>
      <button role="tab" aria-selected="false" data-tab="saved">Saved</button>
      <button role="tab" aria-selected="false" data-tab="profile">Profile</button>
    </nav>

    <section id="panel-library" class="mt-6" role="tabpanel"></section>
    <section id="panel-orders" class="mt-6" role="tabpanel" hidden></section>
    <section id="panel-saved" class="mt-6" role="tabpanel" hidden></section>
    <section id="panel-profile" class="mt-6" role="tabpanel" hidden></section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/account.js"></script>
</body>

</html>
