<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account | DigiStore</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./css/app.css"></head><body class="bg-slate-50 text-slate-900"><header id="site-header" class="sticky top-0 z-40"></header><main class="shell py-10"><div class="mb-8"><span class="eyebrow">MY ACCOUNT</span><h1 class="mt-2 text-3xl font-black text-[#142c55]">Account centre</h1><p id="account-subtitle" class="mt-2 text-slate-600">Loading your account…</p></div><div class="grid gap-7 lg:grid-cols-[1fr_.9fr]"><section class="soft-panel p-6 sm:p-8"><h2 class="text-xl font-black text-[#142c55]">Personal details</h2><form id="profile-form" class="mt-6 grid gap-4 sm:grid-cols-2"><label class="sm:col-span-2"><span class="label">Full name</span><input class="field" name="full_name" required></label><label><span class="label">Phone</span><input class="field" name="phone" autocomplete="tel"></label><label><span class="label">Country</span><input class="field" name="country" autocomplete="country-name"></label><label class="sm:col-span-2"><span class="label">Address</span><textarea class="field min-h-24" name="address" autocomplete="street-address"></textarea></label><label><span class="label">Occupation</span><input class="field" name="occupation"></label><label><span class="label">Age</span><input class="field" name="age" type="number" min="13" max="120"></label><div class="sm:col-span-2"><button class="button button-primary" type="submit">Save changes</button></div><p id="profile-feedback" class="status-line sm:col-span-2" aria-live="polite"></p></form></section><section class="space-y-7"><div class="soft-panel p-6 sm:p-8"><div class="flex justify-between gap-4"><div><h2 class="text-xl font-black text-[#142c55]">Orders & downloads</h2><p class="mt-2 text-sm text-slate-600">Your recent DigiStore purchases.</p></div><a href="./index.html#store" class="text-sm font-bold text-orange-600">Browse catalog</a></div><div id="orders-list" class="mt-5"></div></div><div id="admin-card" class="soft-panel hidden p-6"><span class="tag">Administrator</span><h2 class="mt-3 text-lg font-black text-[#142c55]">Store controls</h2><p class="mt-2 text-sm text-slate-600">You have administrator access to catalog and store operations.</p><a class="button button-primary mt-5" href="./admin.html">Open admin</a></div></section></div></main><script type="module" src="./js/account.js"></script></body></html>
