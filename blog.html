<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="The DigiStore Journal — insights, guides, and release notes from the marketplace.">
  <title>Journal | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body class="selection:bg-[color:var(--accent)] selection:text-[color:var(--accent-ink)] flex flex-col min-h-screen" style="background:var(--bg);color:var(--text)">
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 backdrop-blur shadow-sm"></header>

  <main class="flex-1">
    <section class="page-hero">
      <h1 class="page-hero__title">DigiStore Journal</h1>
      <p class="page-hero__sub">Insights, guides, and release notes from the marketplace. Learn how to grow your digital asset toolkit.</p>
    </section>

    <section class="blog-body">
      <div id="blog-featured-wrap"></div>

      <h2 class="blog-section-title">Latest Articles</h2>
      <div id="blog-grid" class="blog-grid"></div>
    </section>

    <section class="newsletter-band">
      <div class="newsletter-panel">
        <div>
          <h2>Subscribe to our Newsletter</h2>
          <p>New releases, tools, and digital insights — occasionally, never spam.</p>
        </div>
        <form id="subscribe-form" class="newsletter-form">
          <input name="email" required type="email" placeholder="Your email address…">
          <button type="submit">Submit</button>
        </form>
      </div>
      <p id="subscribe-status" class="status-line px-6 pb-4" aria-live="polite"></p>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/blog.js"></script>
</body>

</html>
