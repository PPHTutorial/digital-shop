<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DigiStore news, product updates, and practical digital insights.">
  <title>Blog &amp; Updates | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur shadow-sm"></header>

  <main class="shell py-14 flex-1">
    <span class="eyebrow">DIGISTORE JOURNAL</span>
    <h1 class="mt-3 text-4xl font-black text-[#142c55]">Ideas, releases, and digital tools.</h1>
    <p class="mt-2 text-sm text-slate-500 max-w-xl">Insights from the developers and creators building digital assets at Codeink Technologies.</p>
    <div id="blog-grid" class="mt-9 grid gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/blog.js"></script>

</html>
