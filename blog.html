<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DigiStore news, product updates, and practical digital insights.">
  <title>Journal · DigiStore</title>
  <script>
    try {
      var t = localStorage.getItem('digistore.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="./css/app.css?v=a4e69dd6">
</head>

<body class="page">
  <div id="boot" class="boot">
    <span class="boot__mark">DigiStore</span>
    <div class="progress boot__bar"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container page__body">
    <div class="section__head">
      <div>
        <span class="eyebrow">DigiStore journal</span>
        <h1 class="section__title" style="font-size: var(--t-32)">Ideas, releases, and digital tools.</h1>
        <p class="section__sub">Insights from the developers and creators building digital assets at Codeink Technologies.</p>
      </div>
    </div>

    <div id="blog-grid" class="cards cards--wide mt-8"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/blog.js"></script>
</body>

</html>
