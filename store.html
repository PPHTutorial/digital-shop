<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore the complete DigiStore catalog — digital ebooks, software tools, UI templates, online courses, and media assets.">
  <title>All Products Catalog | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/brand/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#072220">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DigiStore">
  <meta property="og:title" content="All Products Catalog | DigiStore">
  <meta property="og:description" content="Explore the complete DigiStore catalog — digital ebooks, software tools, UI templates, online courses, and media assets.">
  <meta property="og:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <meta property="og:url" content="https://digistore.codeinktechnologies.com/store">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="All Products Catalog | DigiStore">
  <meta name="twitter:description" content="Explore the complete DigiStore catalog — digital ebooks, software tools, UI templates, online courses, and media assets.">
  <meta name="twitter:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <link rel="stylesheet" href="./css/app.css?v=0930facf">
</head>

<body class="selection:bg-[color:var(--accent)] selection:text-[color:var(--accent-ink)] flex flex-col min-h-screen" style="background:var(--bg);color:var(--text)">
  <!-- Initial Instant Page Loader -->
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 backdrop-blur shadow-sm"></header>

  <main class="shell py-8 lg:py-10 flex-1">
    <!-- Vendor storefront header — only rendered for ?vendor=<slug> -->
    <section id="vendor-header" class="soft-panel mb-8 hidden overflow-hidden">
      <div id="vendor-banner" class="h-28" style="background:linear-gradient(120deg,var(--ink-950),var(--ink-800))"></div>
      <div class="flex flex-wrap items-end justify-between gap-5 p-6 pt-0">
        <div class="flex items-end gap-4">
          <span id="vendor-logo" class="avatar !-mt-8 !h-20 !w-20 !border-4 !border-white !text-2xl shadow-lg"></span>
          <div class="pb-1">
            <h1 id="vendor-title" class="text-2xl font-black" style="color:var(--text)"></h1>
            <p id="vendor-meta" class="text-xs font-bold" style="color:var(--text-muted)"></p>
          </div>
        </div>
        <a class="button shrink-0" href="./store">← All products</a>
      </div>
      <p id="vendor-bio" class="px-6 pb-6 text-sm leading-relaxed" style="color:var(--text-muted)"></p>
    </section>

    <!-- Breadcrumb + heading -->
    <div id="store-header">
      <nav class="store-crumb" aria-label="Breadcrumb">
        <a href="./index.html">Home</a>
        <span class="store-crumb__sep">›</span>
        <a href="./store">Shop</a>
        <span id="store-crumb-current" class="hidden">
          <span class="store-crumb__sep">›</span>
          <span id="store-crumb-current-label"></span>
        </span>
      </nav>
      <h1 id="store-heading" class="store-heading">All Products &amp; Assets</h1>
    </div>

    <button type="button" id="dash-menu-button" class="store-filters-toggle" aria-label="Open filters" aria-expanded="false" aria-controls="dash-sidebar">
      <i data-lucide="sliders-horizontal" width="16" height="16"></i><span>Filters</span>
    </button>
    <div id="dash-scrim" class="dash-scrim"></div>

    <div id="store-layout" class="store-layout">
      <!-- Sidebar filters -->
      <aside id="dash-sidebar" class="store-sidebar dash-sidebar" aria-label="Filter products">
        <button type="button" id="dash-sidebar-close" class="dash-sidebar-close" aria-label="Close filters"><i data-lucide="x" width="18" height="18"></i></button>
        <div class="store-filter">
          <div class="store-filter__label">
            <span>Price range</span>
            <button type="button" id="filter-price-clear" class="store-filter__clear">Reset</button>
          </div>
          <div class="store-price-slider">
            <div class="store-price-slider__track"></div>
            <div id="price-slider-fill" class="store-price-slider__fill"></div>
            <input id="price-min-range" type="range" min="0" max="500" value="0" step="1" aria-label="Minimum price">
            <input id="price-max-range" type="range" min="0" max="500" value="500" step="1" aria-label="Maximum price">
          </div>
          <div class="store-price-slider__values">
            <span id="price-min-label">$0</span>
            <span id="price-max-label">$500</span>
          </div>
        </div>

        <div class="store-filter">
          <div class="store-filter__label">
            <span>Category</span>
            <button type="button" id="filter-category-clear" class="store-filter__clear hidden">Clear</button>
          </div>
          <div id="filter-category-list" class="store-check-list"></div>
        </div>

        <div class="store-filter">
          <div class="store-filter__label">
            <span>File type</span>
            <button type="button" id="filter-filetype-clear" class="store-filter__clear hidden">Clear</button>
          </div>
          <div id="filter-filetype-list" class="store-check-list"></div>
        </div>

        <div class="store-filter">
          <div class="store-filter__label">
            <span>Average rating</span>
            <button type="button" id="filter-rating-clear" class="store-filter__clear hidden">Clear</button>
          </div>
          <div id="filter-rating-list" class="store-check-list"></div>
        </div>
      </aside>

      <!-- Catalog content -->
      <div>
        <div class="store-toolbar">
          <div>
            <p id="product-count" class="store-toolbar__count"></p>
            <div id="store-filter-chips" class="store-toolbar__chips"></div>
          </div>
          <div id="store-sort-row" class="flex items-center gap-2">
            <label for="store-sort-select" class="text-xs font-bold whitespace-nowrap" style="color:var(--text-muted)">Sort by:</label>
            <select id="store-sort-select" class="field !mt-0 !py-2 text-xs" style="background:var(--surface-sunken);border-color:var(--border)">
              <option value="bestselling">Bestselling</option>
              <option value="newest">Newest First</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="title">Alphabetical (A-Z)</option>
            </select>
          </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"></div>

        <!-- Numbered pagination -->
        <div id="store-pagination" class="store-pagination"></div>

        <!-- Product Loading State -->
        <div id="product-loading" class="mt-8 hidden">
          <div class="progress-track max-w-xs mx-auto"></div>
          <p class="mt-3 text-center text-sm font-semibold" style="color:var(--text-muted)">Loading catalog items…</p>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/store.js"></script>
</body>

</html>
