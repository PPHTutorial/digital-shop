<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore the complete DigiStore catalog — digital ebooks, software tools, UI templates, online courses, and media assets.">
  <title>All Products Catalog | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen selection:bg-orange-500 selection:text-white">
  <!-- Initial Instant Page Loader -->
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur shadow-sm"></header>

  <main class="shell py-10 lg:py-14 flex-1">
    <!-- Vendor storefront header — only rendered for ?vendor=<slug> -->
    <section id="vendor-header" class="soft-panel mb-8 hidden overflow-hidden">
      <div id="vendor-banner" class="h-28 bg-gradient-to-r from-[#142c55] to-[#24476f]"></div>
      <div class="flex flex-wrap items-end justify-between gap-5 p-6 pt-0">
        <div class="flex items-end gap-4">
          <span id="vendor-logo" class="avatar !-mt-8 !h-20 !w-20 !border-4 !border-white !text-2xl shadow-lg"></span>
          <div class="pb-1">
            <h1 id="vendor-title" class="text-2xl font-black text-[#142c55]"></h1>
            <p id="vendor-meta" class="text-xs font-bold text-slate-500"></p>
          </div>
        </div>
        <a class="button shrink-0" href="./store">← All products</a>
      </div>
      <p id="vendor-bio" class="px-6 pb-6 text-sm leading-relaxed text-slate-600"></p>
    </section>

    <!-- Header Banner -->
    <div id="store-header" class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div>
        <span class="eyebrow">EXPLORE STOREFRONT</span>
        <h1 id="store-heading" class="text-3xl sm:text-4xl font-black tracking-tight text-[#142c55]">All Products</h1>
        <p id="store-subtitle" class="text-sm text-slate-500 mt-1">Browse our complete collection of verified digital assets, ebooks, and tools.</p>
      </div>
      <p id="product-count" class="text-sm font-bold text-slate-500"></p>
    </div>

    <!-- Unified Top Filter Bar -->
    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 mb-8">
      <!-- Categories: a dropdown on small screens, pills from md up. With 20+
           categories a wrapping pill row swallows the whole first screen. -->
      <div class="catfilter">
        <label class="catfilter__compact">
          <span class="catfilter__label">Browse category</span>
          <select id="catalog-category-select" class="field !mt-1 !py-2.5 text-sm"></select>
        </label>
        <div id="catalog-category-pills" class="catfilter__pills"></div>
      </div>

      <!-- Search & Sorting Row -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100">
        <div class="relative flex-1 min-w-[260px]">
          <i data-lucide="search" width="16" height="16" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
          <input id="store-search-input" type="text" placeholder="Search by title, description, keywords, or topics…" class="field !mt-0 !py-2.5 !pl-10 text-xs w-full bg-slate-50 border-slate-200">
        </div>
        <div class="flex items-center gap-2">
          <label for="store-sort-select" class="text-xs font-bold text-slate-500 whitespace-nowrap">Sort by:</label>
          <select id="store-sort-select" class="field !mt-0 !py-2 text-xs bg-slate-50 border-slate-200">
            <option value="newest">Newest First</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="title">Alphabetical (A-Z)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Product Grid (Full Width) -->
    <div id="product-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

    <!-- Load More Button Container -->
    <div id="load-more-container" class="mt-10 text-center hidden">
      <button id="load-more-btn" type="button" class="button !py-3 !px-8 text-sm font-bold shadow-md hover:shadow-lg transition">
        Load more products
      </button>
    </div>

    <!-- Product Loading State -->
    <div id="product-loading" class="mt-8 hidden">
      <div class="progress-track max-w-xs mx-auto"></div>
      <p class="mt-3 text-center text-sm font-semibold text-slate-500">Loading catalog items…</p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/store.js"></script>
</body>

</html>
