<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description"
        content="The complete DigiStore catalog — ebooks, software and tools, templates, courses, audio, and design assets.">
  <title>Catalog · DigiStore</title>
  <link rel="canonical" href="https://digistore.codeinktechnologies.com/store.html">
  <script>
    try {
      var t = localStorage.getItem('digistore.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="./css/app.css?v=a4e69dd6">
</head>

<body class="page">
  <div id="boot" class="boot">
    <span class="boot__mark">DigiStore</span>
    <div class="progress boot__bar"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container page__body">
    <div class="section__head">
      <div>
        <span class="eyebrow">Catalog</span>
        <h1 id="catalog-heading" class="section__title mt-1" style="font-size: var(--t-32)">All products</h1>
        <p id="catalog-sub" class="section__sub">Every published product, filterable by category, price, and keyword.</p>
      </div>
      <p id="catalog-count" class="t-13 muted num" aria-live="polite"></p>
    </div>

    <div class="sidebar-layout sidebar-layout--left" style="--aside-w: 236px">
      <!-- Filters -->
      <aside class="stack-6" aria-label="Filters">
        <section class="panel">
          <div class="panel__head"><h2 class="panel__title">Category</h2></div>
          <div class="panel__body stack-2" id="facet-categories">
            <p class="t-12 subtle">Loading…</p>
          </div>
        </section>

        <section class="panel">
          <div class="panel__head"><h2 class="panel__title">Price</h2></div>
          <div class="panel__body stack-3">
            <div class="row row-2">
              <label class="field fill">
                <span class="field__label" for="price-min">Min</span>
                <input class="input" id="price-min" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </label>
              <label class="field fill">
                <span class="field__label" for="price-max">Max</span>
                <input class="input" id="price-max" type="number" min="0" step="1" inputmode="numeric" placeholder="Any">
              </label>
            </div>
            <button class="btn btn--sm btn--block" id="apply-price" type="button">Apply price range</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel__head"><h2 class="panel__title">Tags</h2></div>
          <div class="panel__body row row--wrap row-2" id="facet-tags">
            <p class="t-12 subtle">Loading…</p>
          </div>
        </section>

        <button class="btn btn--sm btn--block" id="reset-filters" type="button">Reset all filters</button>
      </aside>

      <!-- Results -->
      <div>
        <div class="toolbar">
          <label class="input-affix toolbar__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.1 4.1"/></svg>
            <input class="input" id="catalog-search" type="search" autocomplete="off"
                   placeholder="Search titles, descriptions, and tags" aria-label="Search the catalog">
          </label>
          <label class="row row-2 t-12 muted nowrap">
            <span for="catalog-sort">Sort</span>
            <select class="select" id="catalog-sort" style="width:auto" aria-label="Sort results">
              <option value="relevance">Relevance</option>
              <option value="newest">Newest first</option>
              <option value="best-selling">Best selling</option>
              <option value="price-asc">Price, low to high</option>
              <option value="price-desc">Price, high to low</option>
              <option value="title">Title A–Z</option>
            </select>
          </label>
        </div>

        <div id="active-filters" class="row row--wrap row-2 mt-4" hidden></div>

        <div id="catalog-grid" class="cards mt-5"></div>

        <div id="catalog-more" class="center mt-8" hidden>
          <button class="btn" id="load-more" type="button">Load more</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/store.js"></script>
</body>

</html>
