<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Cart | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/brand/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#072220">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DigiStore">
  <meta property="og:title" content="Your Cart | DigiStore">
  <meta property="og:description" content="Premium digital ebooks, software, tools, templates, and courses with instant secure downloads.">
  <meta property="og:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <meta property="og:url" content="https://digistore.codeinktechnologies.com/cart">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Cart | DigiStore">
  <meta name="twitter:description" content="Premium digital ebooks, software, tools, templates, and courses with instant secure downloads.">
  <meta name="twitter:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <link rel="stylesheet" href="./css/app.css?v=0930facf">
</head>

<body class="selection:bg-[color:var(--accent)] selection:text-[color:var(--accent-ink)] flex flex-col min-h-screen" style="background:var(--bg);color:var(--text)">
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 backdrop-blur shadow-sm"></header>

  <main class="flex-1">
    <div class="cart-page-header">
      <h1>Your Shopping Cart</h1>
    </div>

    <div id="cart-loading" class="cart-layout">
      <div class="uk-skel-card" style="height:120px"></div>
      <div class="uk-skel-card" style="height:220px"></div>
    </div>

    <div id="cart-layout" class="cart-layout hidden">
      <div id="cart-items-list" class="cart-items-list"></div>

      <aside class="cart-summary">
        <h2>Order Summary</h2>
        <div id="cart-summary-lines"></div>
        <div class="cart-summary-total">
          <span>Total</span>
          <strong id="cart-total">$0.00</strong>
        </div>
        <a id="cart-checkout-btn" class="cart-checkout-btn" href="./checkout">Proceed to Checkout</a>
        <a class="cart-continue-link" href="./store">Continue Shopping</a>
      </aside>
    </div>

    <div id="cart-empty" class="cart-empty-wrap hidden">
      <div class="cart-empty">
        <span class="cart-empty__icon"><i data-lucide="shopping-bag" width="26" height="26"></i></span>
        <h2>Your cart is empty</h2>
        <p>Browse the catalog and add something you'll actually use.</p>
        <a class="button button-primary cart-empty__cta" href="./store">Browse Products</a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/cart.js"></script>
</body>

</html>
