<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Submit a support ticket to the DigiStore team.">
  <title>Support desk · DigiStore</title>
  <script>
    try {
      var t = localStorage.getItem('digistore.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="./css/app.css?v=a4e69dd6">
</head>

<body class="page">
  <div id="boot" class="boot">
    <span class="boot__mark">DigiStore</span>
    <div class="progress boot__bar"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container container--narrow page__body">
    <div class="section__head">
      <div>
        <span class="eyebrow">Support &amp; helpdesk</span>
        <h1 class="section__title" style="font-size: var(--t-32)">How can we help?</h1>
        <p class="section__sub">
          Submit a ticket for payment confirmation, download access, licence keys, or technical
          questions. Our team responds promptly.
        </p>
      </div>
    </div>

    <section class="panel mt-6">
      <div class="panel__body">
        <form id="support-form" class="grid12" style="row-gap: var(--s-4)">
          <label class="field col-6 col-sm-12">
            <span class="field__label">Your name<span class="req"> *</span></span>
            <input class="input" name="name" placeholder="John Doe" required>
          </label>
          <label class="field col-6 col-sm-12">
            <span class="field__label">Your email<span class="req"> *</span></span>
            <input class="input" name="email" type="email" placeholder="john@example.com" required>
          </label>
          <label class="field col-6 col-sm-12">
            <span class="field__label">Order reference / transaction ID</span>
            <input class="input" name="order_ref" placeholder="e.g. DS-2608-00123">
          </label>
          <label class="field col-6 col-sm-12">
            <span class="field__label">Issue category<span class="req"> *</span></span>
            <select class="select" name="category">
              <option value="Payment">Payment &amp; gateway confirmation</option>
              <option value="Download">Download token &amp; file access</option>
              <option value="Account">Customer account &amp; vault</option>
              <option value="Licensing">Product licensing &amp; updates</option>
              <option value="Other">Other inquiries</option>
            </select>
          </label>
          <label class="field col-12">
            <span class="field__label">Subject<span class="req"> *</span></span>
            <input class="input" name="subject" placeholder="Brief summary of your question" required>
          </label>
          <label class="field col-12">
            <span class="field__label">Detailed message<span class="req"> *</span></span>
            <textarea class="textarea" name="message" rows="5"
                      placeholder="Describe the issue in detail (include error messages if applicable)…" required></textarea>
          </label>
          <div class="col-12">
            <button class="btn btn--lg btn--primary" type="submit">Submit support ticket</button>
          </div>
        </form>
      </div>
    </section>

    <div class="section__head mt-9">
      <div>
        <span class="eyebrow">Common questions</span>
        <h2 class="section__title" style="font-size: var(--t-26)">Frequently asked questions</h2>
      </div>
    </div>
    <div id="faq-grid" class="cards mt-5"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/support.js"></script>
</body>

</html>
