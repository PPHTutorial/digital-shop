<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Order complete — Northstar Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/app.css">
</head>

<body class="min-h-screen bg-stone-50 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-5 py-16">
        <section class="soft-panel w-full p-8 text-center sm:p-12">
            <div
                class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-slate-950 text-2xl font-black text-white">
                ✓</div><span class="eyebrow mt-7">ORDER STATUS</span>
            <h1 id="status-title" class="mt-3 text-4xl font-black tracking-tight">Checking your payment…</h1>
            <p id="status-copy" class="mx-auto mt-4 max-w-xl leading-7 text-slate-600">We are confirming the transaction
                with the payment provider before releasing your download.</p>
            <div id="download-area" class="mt-8"></div>
            <p class="mt-8 text-xs leading-5 text-slate-500">A copy of your receipt and store updates may be sent to
                your email. Need help? <a class="font-bold text-slate-900" href="./support.html">Open support</a>.</p>
        </section>
    </main>
    <script type="module" src="./js/success.js"></script>
</body>

</html>
