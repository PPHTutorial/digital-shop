<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order Status | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/brand/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#072220">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DigiStore">
  <meta property="og:title" content="Order Status | DigiStore">
  <meta property="og:description" content="Premium digital ebooks, software, tools, templates, and courses with instant secure downloads.">
  <meta property="og:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <meta property="og:url" content="https://digistore.codeinktechnologies.com/success">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Order Status | DigiStore">
  <meta name="twitter:description" content="Premium digital ebooks, software, tools, templates, and courses with instant secure downloads.">
  <meta name="twitter:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <script>try{var t=localStorage.getItem("digistore-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="stylesheet" href="./css/app.css?v=2e86bd0f">
</head>

<body class="selection:bg-[color:var(--accent)] selection:text-[color:var(--accent-ink)] flex flex-col min-h-screen" style="background:var(--bg);color:var(--text)">
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 backdrop-blur shadow-sm"></header>

  <main class="flex-1">
    <div class="success-shell">
      <section class="success-card">
        <div id="status-icon-container" class="success-icon">
          <span id="status-icon">…</span>
        </div>
        <span id="status-eyebrow" class="eyebrow">TRANSACTION STATUS</span>
        <h1 id="status-title">Checking your order…</h1>
        <p id="status-copy">Please hold on while we verify your transaction status.</p>
        <div id="download-area"></div>
      </section>

      <section id="success-cross-sell" class="success-cross-sell hidden">
        <h2>You Might Also Like</h2>
        <div id="success-cross-sell-grid" class="success-cross-sell-grid"></div>
      </section>

      <p class="success-help">
        Need assistance with your purchase? <a href="./support">Contact DigiStore Support</a>.
      </p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/success.js"></script>
</body>

</html>
