<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Order status · DigiStore</title>
  <script>
    try {
      var t = localStorage.getItem('digistore.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="./css/app.css?v=a4e69dd6">
</head>

<body class="page">
  <div id="boot" class="boot">
    <span class="boot__mark">DigiStore</span>
    <div class="progress boot__bar"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container container--narrow page__body flex justify-center items-start">
    <section class="panel" style="width: 100%">
      <div class="panel__body stack-4 center" style="padding: var(--s-9)">
        <span id="status-icon"></span>
        <div>
          <span id="status-eyebrow" class="eyebrow">Transaction status</span>
          <h1 id="status-title" class="mt-2" style="font-size: var(--t-26)">Checking your order…</h1>
          <p id="status-copy" class="t-13 muted mt-2" style="max-width: 44ch; margin-inline: auto">
            Please hold on while we verify your transaction status.
          </p>
        </div>
        <div id="download-area" class="mt-2"></div>
      </div>
      <div class="panel__foot center" style="justify-content: center">
        <span>Need assistance with your purchase? <a href="./support.html">Contact DigiStore support</a>.</span>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/success.js"></script>
</body>

</html>
