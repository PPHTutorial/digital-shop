<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order Status | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur shadow-sm"></header>

  <main class="shell flex-1 flex items-center justify-center py-12 sm:py-16">
    <section class="soft-panel w-full max-w-2xl p-8 text-center sm:p-12 bg-white rounded-3xl border border-slate-200 shadow-md">
      <div id="status-icon-container" class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-slate-100 text-2xl font-black text-slate-700">
        <span id="status-icon">…</span>
      </div>
      <span id="status-eyebrow" class="eyebrow mt-6">TRANSACTION STATUS</span>
      <h1 id="status-title" class="mt-2 text-3xl sm:text-4xl font-black tracking-tight text-[#142c55]">Checking your order…</h1>
      <p id="status-copy" class="mx-auto mt-3 max-w-xl text-sm leading-relaxed text-slate-600">Please hold on while we verify your transaction status.</p>
      <div id="download-area" class="mt-8"></div>
      <p class="mt-8 text-xs leading-5 text-slate-400 border-t border-slate-100 pt-6">
        Need assistance with your purchase? <a class="font-bold text-slate-900 hover:underline" href="./support.html">Contact DigiStore Support</a>.
      </p>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/success.js"></script>
</body>

</html>
