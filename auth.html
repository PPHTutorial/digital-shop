<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Northstar Books</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./css/app.css"></head>
<body class="flex min-h-screen items-center justify-center bg-stone-50 p-5 text-slate-900"><main class="soft-panel w-full max-w-md p-7 sm:p-9"><a class="text-sm font-black" href="./index.html">NORTHSTAR<span class="text-slate-500">BOOKS</span></a><h1 id="auth-title" class="mt-8 text-3xl font-black"></h1><p class="mt-3 text-sm leading-6 text-slate-600">Use your account to securely complete purchases and view protected content.</p><form id="auth-form" class="mt-7 grid gap-4"><label id="full-name-wrap"><span class="label">Full name</span><input class="field" name="full_name" autocomplete="name"></label><label><span class="label">Email</span><input class="field" name="email" type="email" autocomplete="email" required></label><label><span class="label">Password</span><input class="field" name="password" type="password" minlength="10" autocomplete="current-password" required></label><p id="auth-notice" class="text-sm text-slate-600" aria-live="polite"></p><button id="auth-submit" class="rounded-full bg-slate-950 px-6 py-3 font-bold text-white"></button></form><button id="auth-toggle" type="button" class="mt-5 text-sm font-bold text-slate-600 underline"></button></main><script type="module" src="./js/auth.js"></script></body></html>
