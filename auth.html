<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In or Create Account | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/brand/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#072220">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DigiStore">
  <meta property="og:title" content="Sign In or Create Account | DigiStore">
  <meta property="og:description" content="Premium digital ebooks, software, tools, templates, and courses with instant secure downloads.">
  <meta property="og:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <meta property="og:url" content="https://digistore.codeinktechnologies.com/auth">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign In or Create Account | DigiStore">
  <meta name="twitter:description" content="Premium digital ebooks, software, tools, templates, and courses with instant secure downloads.">
  <meta name="twitter:image" content="https://digistore.codeinktechnologies.com/img/brand/og-image.png">
  <script>try{var t=localStorage.getItem("digistore-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="stylesheet" href="./css/app.css?v=a593b43c">
</head>

<body class="selection:bg-[color:var(--accent)] selection:text-[color:var(--accent-ink)] flex flex-col min-h-screen" style="background:var(--bg);color:var(--text)">
  <div id="page-loader" class="page-loader">
    <div class="loader-card">
      <div class="shimmer logo"></div>
      <div class="shimmer hero"></div>
      <div class="shimmer short"></div>
    </div>
  </div>

  <header id="site-header" class="sticky top-0 z-40 backdrop-blur shadow-sm"></header>

  <main class="flex-1">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" id="tab-signin" role="tab">Sign In</button>
          <button type="button" id="tab-signup" role="tab">Create Account</button>
        </div>

        <form id="auth-form" class="auth-form">
          <div class="form-field hidden" id="full-name-wrap">
            <label for="full_name">Full Name</label>
            <input id="full_name" name="full_name" autocomplete="name" placeholder="Your full name">
          </div>
          <div class="form-field">
            <label for="auth-email">Email Address</label>
            <input id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="form-field">
            <div class="auth-label-row">
              <label for="auth-password">Password</label>
              <a href="#" id="forgot-password-link">Forgot password?</a>
            </div>
            <input id="auth-password" name="password" type="password" minlength="8" autocomplete="current-password" placeholder="••••••••••••" required>
          </div>
          <label class="form-field hidden" id="auth-terms-wrap" style="flex-direction:row;align-items:flex-start;gap:8px;font-size:.82rem">
            <input type="checkbox" id="auth-accept" name="accept_terms" style="margin-top:3px">
            <span>I agree to the <a href="./legal?doc=terms" target="_blank" rel="noopener">Terms of Service</a>, <a href="./legal?doc=privacy" target="_blank" rel="noopener">Privacy Policy</a> and <a href="./legal?doc=refunds" target="_blank" rel="noopener">Refund Policy</a>.</span>
          </label>
          <p id="auth-notice" class="status-line" aria-live="polite"></p>
          <button id="auth-submit" type="submit" class="auth-submit">Sign In to Account</button>
        </form>
      </div>

      <div class="auth-trust">
        <span class="auth-trust__item"><i data-lucide="shield-check" width="16" height="16"></i> Secure 256-bit SSL Checkout</span>
        <span class="auth-trust__item"><i data-lucide="lock" width="16" height="16"></i> Encrypted payments via Flutterwave &amp; NOWPayments</span>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/auth.js"></script>
</body>

</html>
