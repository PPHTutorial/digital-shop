<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account Sign In &amp; Registration | DigiStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">
  <header id="site-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur shadow-sm"></header>

  <main class="shell flex-1 flex items-center justify-center py-12 sm:py-16">
    <div class="soft-panel w-full max-w-md p-8 sm:p-10 bg-white rounded-3xl border border-slate-200 shadow-md">
      <a class="brand text-lg" href="./index.html">
        <span class="brand-mark !h-9 !w-9">D</span>
        <span>DigiStore<small>powered by codeinktechnologies</small></span>
      </a>
      <h1 id="auth-title" class="mt-6 text-2xl sm:text-3xl font-black text-[#142c55]">Sign in to DigiStore</h1>
      <p class="mt-2 text-xs leading-relaxed text-slate-600">Access your purchased products, protected downloads, and order receipts in one secure dashboard.</p>

      <form id="auth-form" class="mt-6 grid gap-4">
        <label id="full-name-wrap">
          <span class="label">Full name</span>
          <input class="field" name="full_name" autocomplete="name" placeholder="Your full name">
        </label>
        <label>
          <span class="label">Email address *</span>
          <input class="field" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span class="label">Password *</span>
          <input class="field" name="password" type="password" minlength="8" autocomplete="current-password" placeholder="••••••••••••" required>
        </label>
        <p id="auth-notice" class="status-line" aria-live="polite"></p>
        <button id="auth-submit" class="button button-primary w-full !py-3 font-bold text-sm shadow-md">Sign In</button>
      </form>

      <button id="auth-toggle" type="button" class="mt-5 text-xs font-bold text-orange-600 hover:text-orange-700 underline block text-center w-full">
        Need an account? Create one here →
      </button>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/auth.js"></script>
</body>

</html>
