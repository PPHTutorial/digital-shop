<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Sign in to DigiStore or create an account.">
  <title>Sign in · DigiStore</title>
  <script>
    try {
      var t = localStorage.getItem('digistore.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="./css/app.css?v=a4e69dd6">
</head>

<body class="page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container page__body flex justify-center items-start">
    <div class="auth-card">
      <span class="eyebrow" id="auth-eyebrow">Account</span>
      <h1 id="auth-title" class="mt-2" style="font-size: var(--t-26)">Sign in</h1>
      <p id="auth-lede" class="t-13 muted mt-2">
        Your purchases, download links, and receipts live in one place.
      </p>

      <form id="auth-form" class="stack-4 mt-7" novalidate>
        <label class="field" id="name-field" hidden>
          <span class="field__label" for="full_name">Full name<span class="req"> *</span></span>
          <input class="input" id="full_name" name="full_name" autocomplete="name" placeholder="Ada Lovelace">
        </label>

        <label class="field">
          <span class="field__label" for="email">Email address<span class="req"> *</span></span>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required
                 placeholder="you@example.com">
        </label>

        <label class="field">
          <span class="field__label" for="password">Password<span class="req"> *</span></span>
          <input class="input" id="password" name="password" type="password" minlength="8" required
                 autocomplete="current-password" placeholder="At least 8 characters">
          <span class="field__hint" id="password-hint">Use at least 8 characters.</span>
        </label>

        <p id="auth-status" class="status" aria-live="polite"></p>

        <button class="btn btn--lg btn--primary btn--block" id="auth-submit" type="submit">Sign in</button>
      </form>

      <div class="row row-3 mt-6 border-t pt-4">
        <button class="btn btn--link t-13" id="auth-toggle" type="button">Create an account instead</button>
        <button class="btn btn--link t-13 ml-auto" id="auth-reset" type="button">Forgot password?</button>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="./js/auth.js"></script>
</body>

</html>
