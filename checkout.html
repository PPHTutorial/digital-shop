<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | DigiStore</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./css/app.css"></head><body class="bg-slate-50 text-slate-900"><header id="site-header" class="sticky top-0 z-40"></header><main class="shell py-10 lg:py-14"><div class="mb-8"><span class="eyebrow">SECURE CHECKOUT</span><h1 class="mt-2 text-3xl font-black text-[#142c55]">Review and pay</h1><p id="checkout-status" class="mt-2 text-sm text-slate-600">Checking your secure account session…</p></div><div class="grid gap-7 lg:grid-cols-[1fr_390px]"><section class="soft-panel p-6 sm:p-8"><div class="flex items-start justify-between gap-4"><div><span class="tag">Step 1</span><h2 class="mt-3 text-xl font-black text-[#142c55]">Payment method</h2><p class="mt-2 max-w-xl text-sm leading-6 text-slate-600">Your account information is securely managed in your account area. Choose a payment provider to continue.</p></div><a href="./account.html" class="text-sm font-bold text-orange-600">Manage account</a></div><form id="checkout-form" class="mt-7"><div class="grid gap-3"><button name="provider" value="flutterwave" class="button button-primary w-full" type="submit">Continue with Flutterwave</button><button name="provider" value="nowpayments" class="button w-full" type="submit">Pay with crypto · NOWPayments</button></div><p id="checkout-feedback" class="status-line mt-4" aria-live="polite"></p><a href="./index.html#store" class="mt-6 inline-block text-sm font-bold text-slate-500">← Back to catalog</a></form></section><aside class="h-fit soft-panel p-6 sm:p-8"><span class="tag">Order summary</span><div id="order-summary" class="mt-5"></div><div class="mt-6 border-t border-slate-200 pt-5"><label class="label" for="promo-code">Promotion code</label><div class="mt-2 flex gap-2"><input id="promo-code" class="field !mt-0" placeholder="Enter code" autocomplete="off"><button id="apply-promo" type="button" class="button !min-h-10 !px-4">Apply</button></div><p id="promo-feedback" class="status-line mt-2" aria-live="polite"></p></div><div class="mt-6 border-t border-slate-200 pt-5"><div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Subtotal</span><strong id="subtotal">—</strong></div><div id="discount-row" class="mt-3 hidden justify-between text-sm text-green-700"><span class="font-semibold">Discount</span><strong id="discount">—</strong></div><div class="mt-4 flex justify-between text-lg"><span class="font-black text-[#142c55]">Total</span><strong id="total" class="text-2xl text-[#142c55]">—</strong></div></div></aside></div></main><script type="module" src="./js/checkout.js"></script></body></html>
